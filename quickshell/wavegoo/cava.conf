; raw audio levels for the bar's particles (read by shell.qml)
[general]
bars = 8
framerate = 30
autosens = 1

[input]
method = pipewire
source = auto

[output]
channels = mono
mono_option = average
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
